# nice!nano / nRF52840 Pro Micro / SuperMini board-specific config
#
# Built as the upstream Zephyr board `promicro_nrf52840/nrf52840/uf2` (see the
# ZEPHYR_BOARD mapping in nrf/Makefile). That variant already carries the
# Adafruit nRF52 UF2 bootloader + SoftDevice s140 v6 layout (code at 0x26000,
# nrf52840_partition_uf2_sdv6.dtsi), which is what the nice!nano bootloader
# (nice_nano_bootloader-*_s140_6.1.1) and the common clones expect.
# Partition Manager picks up pm_static_promicro_nrf52840_nrf52840_uf2.yml for
# the same layout.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
