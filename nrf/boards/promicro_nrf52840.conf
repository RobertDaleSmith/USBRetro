# Pro Micro nRF52840 (nice!nano / SuperMini clones) board-specific config
#
# Ships the Adafruit nRF52 UF2 bootloader. The first UF2 flashed replaces the
# factory SoftDevice, after which the app starts right after the MBR at 0x1000,
# so MCUboot and the Nordic bootloader support are both off and the partition
# map comes from the overlay's devicetree rather than the upstream default.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
