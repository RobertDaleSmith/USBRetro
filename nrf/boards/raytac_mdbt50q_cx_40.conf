# Raytac MDBT50Q-CX-40 dongle board-specific config
#
# Nordic nRF5 legacy DFU bootloader, not UF2: the artifact is a HEX (packaged
# into a signed .zip for nrfutil), and the app starts after the MBR at 0x1000.
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=y
CONFIG_BUILD_OUTPUT_UF2=n
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BOOTLOADER_MCUBOOT=n

# Partition Manager owns the layout (pm_static_raytac_mdbt50q_cx_40.yml), so the
# app offset must NOT come from a devicetree code partition.
CONFIG_PARTITION_MANAGER_ENABLED=y
# This board is flashed over DFU, never `west flash`; without this the PM
# runner check fails the build.
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# No display on this dongle.
CONFIG_DISPLAY=n
